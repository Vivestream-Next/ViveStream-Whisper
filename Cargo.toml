[package]
name = "vivestream-whisper"
version = "1.0.0"
edition = "2021"
authors = ["Vivestream Revived Team"]
description = "Pure Rust Native Whisper Engine for synchronized lyrics and subtitles"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
symphonia = { version = "0.5.4", features = ["mp3", "isomp4", "alac", "flac", "wav", "aac", "ogg", "vorbis"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokenizers = { version = "0.22", default-features = false, features = ["progressbar"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
